          <span id="themeLabel">Light</span>
        </button>
      </div>
    </header>

    <!-- ===== HOME PAGE ===== -->
    <main id="homePage">

      <!-- SEARCH SECTION (glass style) -->
      <div class="search-section" id="searchSection">
        <div class="search-box" id="searchBox">
          <iconify-icon icon="mdi:magnify" class="search-icon"></iconify-icon>
          <input type="text" id="globalSearchInput"
                 placeholder="ابحث عن كلمة، تعبير، أو مرادف..."
                 autocomplete="off"
                 spellcheck="false">
          <button class="search-clear" id="searchClearBtn" aria-label="Clear" hidden>
            <iconify-icon icon="mdi:close-circle"></iconify-icon>
          </button>
          <kbd class="search-kbd" id="searchKbd">Ctrl K</kbd>
        </div>

        <div class="search-results" id="searchResults"></div>
      </div>

      <!-- UNITS TREE -->
      <section class="units-tree" id="unitsTree">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </section>
    </main>

    <!-- ===== VIEWER PAGE ===== -->
    <main id="viewerPage" class="hidden">

      <div class="viewer-header">
        <button class="back-btn" id="backBtn" aria-label="Back to home">
          <iconify-icon icon="mdi:arrow-left"></iconify-icon>
          <span>رجوع</span>
        </button>
        <div class="file-title-view">
          <iconify-icon icon="mdi:file-document-outline"></iconify-icon>
          <span id="viewerTitleText"></span>
        </div>
        <button class="tool-btn danger" id="resetProgressBtn" aria-label="Reset progress">
          <iconify-icon icon="mdi:delete-sweep-outline"></iconify-icon>
          <span>مسح التقدم</span>
        </button>
      </div>

      <div class="progress-wrap">
        <div class="progress-info">
          <span>
            <iconify-icon icon="mdi:progress-check" style="vertical-align:middle;"></iconify-icon>
            <span>التقدم</span>
          </span>
          <span><strong id="progressText">0 / 0</strong> <span>كلمة محفوظة</span></span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="tools-bar">
        <button class="tool-btn" id="expandAllBtn">
          <iconify-icon icon="mdi:unfold-more-horizontal"></iconify-icon> افتح الكل
        </button>
        <button class="tool-btn" id="collapseAllBtn">
          <iconify-icon icon="mdi:unfold-less-horizontal"></iconify-icon> اقفل الكل
        </button>
      </div>

      <div class="markdown-body" id="markdownContent"></div>
    </main>
