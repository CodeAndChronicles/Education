<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E.English · Study Platform</title>

  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/viewer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <div id="app">

    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="logo">
        <iconify-icon icon="mdi:book-open-page-variant"></iconify-icon>
        E.English
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
        <iconify-icon id="themeIcon" icon="mdi:weather-sunny"></iconify-icon>
        <span id="themeLabel">Light</span>
      </button>
    </div>

    <!-- HOME PAGE -->
    <div id="homePage">
      <div class="search-section">
        <div class="search-box">
          <iconify-icon icon="mdi:magnify"></iconify-icon>
          <input type="text" id="globalSearchInput"
                 placeholder="ابحث في كل الملفات (عربي أو إنجليزي)..."
                 autocomplete="off">
          <button id="searchBtn">
            <iconify-icon icon="mdi:magnify"></iconify-icon> Search
          </button>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="cards-grid" id="cardsList">
        <!-- skeletons -->
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>

    <!-- VIEWER PAGE -->
    <div id="viewerPage" class="hidden">

      <div class="viewer-header">
        <button class="back-btn" id="backBtn" aria-label="Back to home">
          <iconify-icon icon="mdi:arrow-left"></iconify-icon> Back
        </button>
        <div class="file-title-view">
          <iconify-icon icon="mdi:file-document-outline"></iconify-icon>
          <span id="viewerTitleText"></span>
        </div>
        <button class="tool-btn danger" id="resetProgressBtn" aria-label="Reset progress">
          <iconify-icon icon="mdi:delete-sweep-outline"></iconify-icon> مسح التقدم
        </button>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-info">
          <span>
            <iconify-icon icon="mdi:progress-check" style="vertical-align:middle;"></iconify-icon>
            Progress
          </span>
          <span><strong id="progressText">0 / 0</strong> words saved</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="tools-bar">
        <button class="tool-btn" id="expandAllBtn">
          <iconify-icon icon="mdi:unfold-more-horizontal"></iconify-icon> افتح الكل
        </button>
        <button class="tool-btn" id="collapseAllBtn">
          <iconify-icon icon="mdi:unfold-less-horizontal"></iconify-icon> اقفل الكل
        </button>
      </div>

      <div class="markdown-body" id="markdownContent"></div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <!-- Scripts: order matters -->
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/UImd.js"></script>
  <script src="js/search.js"></script>
  <script src="js/ui-cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
